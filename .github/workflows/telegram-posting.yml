name: Telegram Posting

on:
  schedule:
    - cron: '0 9-19 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post to Telegram
        env:
          WORKER_URL: https://neuru-telegram-proxy.levshina900.workers.dev
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: python3 .github/scripts/post_telegram.py

      - name: Save state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "posted: dzen"
          git push
