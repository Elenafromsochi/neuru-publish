name: Telegram Posting

on:
  # Один пост в день в 12:00 МСК, начиная с неопубликованных за прошлые дни.
  # Запуски идут каждые полчаса с 10:05 до 23:35: до 12:00 скрипт Telegram
  # ничего не публикует, но каждый прогон запускает постинг ВК,
  # у которого окно с 10:00. Лишнего не выйдет: скрипт Telegram выпускает
  # только один пост за день.
  # 7-20 UTC = 10:00-23:59 МСК.
  schedule:
    - cron: '5,35 7-20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Пробный режим: показать, что вышло бы, ничего не отправляя'
        type: boolean
        default: false

# Два прогона одновременно могли бы опубликовать один пост дважды
concurrency:
  group: telegram-posting
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Настройки расписания — меняются здесь, скрипт править не нужно
          POST_HOUR: '12'           # час выхода поста дня по Москве
          POSTS_PER_DAY: '1'        # постов в день
          POST_BACKLOG_DAYS: '14'   # за сколько прошлых дней добирать неопубликованные
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 .github/scripts/post_telegram.py

      # Отметки сохраняются при любом исходе, push — с повтором,
      # чтобы вышедший пост не опубликовался второй раз
      - name: Save state
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A social/posting
          if git diff --staged --quiet; then
            echo "Состояние не изменилось"
            exit 0
          fi
          git commit -m "posted: telegram"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push не прошёл, попытка $i — повторяю через 10 с"
            sleep 10
          done
          echo "::error::Состояние не сохранено — возможна повторная публикация"
          exit 1
