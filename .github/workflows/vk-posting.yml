name: VK Posting

on:
  # Расписание пока выключено: сначала проверяем публикацию кнопкой.
  # Когда всё устроит — раскомментируйте строки ниже (9-19 UTC = 12:00-22:00 МСК).
  # schedule:
  #   - cron: '30 9-19 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post to VK
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
        run: python3 .github/scripts/post_vk.py

      - name: Save state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "posted: vk"
          git push
