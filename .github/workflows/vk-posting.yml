name: VK Posting

on:
  # Посты выходят по одному в час с 10:00 до 21:00 МСК, сначала неопубликованные
  # за прошлые дни, потом сегодняшние. Скрипт сам считает,
  # сколько постов должно было выйти к текущему часу, и публикует не больше
  # одного за прогон и не чаще раза в 45 минут. Расписание частое, потому что
  # GitHub запускает cron с задержкой и часть окон пропускает.
  # 7-20 UTC = 10:00-23:59 МСК: запас после 21:00 — на случай задержек,
  # чтобы последние посты дня всё равно вышли.
  # Минуты смещены от телеграмного постинга, чтобы прогоны не спорили за коммит.
  schedule:
    - cron: '7,27,47 7-20 * * *'
  workflow_dispatch:
  # Страховка: расписание GitHub у этого файла может не срабатывать,
  # а у Telegram Posting оно работает. Поэтому постинг ВК запускается
  # и после каждого прогона Telegram. Лишнего не выйдет: скрипт сам
  # держит один пост в час и паузу 45 минут.
  workflow_run:
    workflows: ["Telegram Posting"]
    types: [completed]

# Два прогона одновременно могли бы опубликовать один пост дважды
concurrency:
  group: vk-posting
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Pillow перекодирует картинку в JPEG перед загрузкой в ВК
      - name: Install Pillow
        run: python3 -m pip install --quiet --user pillow || python3 -m pip install --quiet --break-system-packages pillow || true

      - name: Post to VK
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          # Необязательный: ключ пользователя-администратора для загрузки картинок.
          # Если не задан, картинки грузятся ключом VK_ACCESS_TOKEN.
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          # Настройки расписания — меняются здесь, скрипт править не нужно
          POST_FIRST_HOUR: '10'     # первый пост дня, час по Москве
          POST_LAST_HOUR: '21'      # последний пост дня, час по Москве
          POST_BACKLOG_DAYS: '14'   # за сколько прошлых дней добирать неопубликованные
          POST_MAX_PER_RUN: '1'     # сколько постов максимум за один прогон
          POST_MIN_GAP_MIN: '45'    # минимум минут между постами
          POST_GAP_SEC: '30'        # пауза, если за прогон выходит больше одного
        run: python3 .github/scripts/post_vk.py

      # Состояние сохраняется при любом исходе: если пост вышел, а следующий
      # шаг упал, отметка о вышедшем посте всё равно попадёт в репозиторий,
      # и он не опубликуется повторно.
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A social/posting
          if git diff --staged --quiet; then
            echo "Состояние не изменилось"
            exit 0
          fi
          git commit -m "posted: vk"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push не прошёл, попытка $i — повторяю через 10 с"
            sleep 10
          done
          echo "::error::Состояние не сохранено — возможна повторная публикация"
          exit 1
